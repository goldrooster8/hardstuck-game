<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Hardstuck</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      font-family: 'Segoe UI', system-ui, sans-serif;
    }

    body {
      background-color: #121212;
      color: #eee;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      text-align: center;
      padding: 20px;
    }

    #app {
      width: 100%;
      max-width: 900px;
    }

    .hidden {
      display: none !important;
    }

    button {
      background-color: #333;
      border: none;
      color: white;
      padding: 12px 24px;
      margin: 8px;
      border-radius: 8px;
      font-size: 1rem;
      cursor: pointer;
      transition: background 0.2s;
    }

    button:hover {
      background-color: #555;
    }

    button:disabled {
      background-color: #1e1e1e;
      color: #666;
      cursor: not-allowed;
    }

    input {
      padding: 12px;
      margin: 10px 5px;
      border-radius: 8px;
      border: 1px solid #444;
      background: #1e1e1e;
      color: white;
      font-size: 1rem;
      width: 200px;
    }

    .card {
      display: inline-block;
      width: 60px;
      height: 80px;
      border-radius: 8px;
      margin: 4px;
      text-align: center;
      line-height: 80px;
      font-weight: bold;
      font-size: 1.2rem;
      color: white;
      border: 1px solid #555;
      background: #333;
      box-shadow: 0 2px 5px rgba(0,0,0,0.5);
    }

    .discard-pile {
      display: inline-block;
      margin: 10px 15px;
      vertical-align: top;
    }

    .player-area {
      background: #1e1e1e;
      border-radius: 12px;
      padding: 15px;
      margin: 15px 0;
      box-shadow: 0 0 10px rgba(0,0,0,0.5);
    }

    .player-name {
      font-weight: bold;
      font-size: 1.1rem;
      margin-bottom: 8px;
    }

    .timer {
      font-size: 1.6rem;
      font-weight: bold;
      color: #ff5555;
      margin-left: 15px;
    }

    .room-code {
      font-size: 2rem;
      font-weight: bold;
      letter-spacing: 4px;
      background: #1e1e1e;
      padding: 10px 20px;
      border-radius: 12px;
      display: inline-block;
    }

    .label {
      font-size: 0.9rem;
      color: #aaa;
    }
  </style>
</head>
<body>
  <div id="app">
    <!-- Step 1: Choose Create or Join -->
    <div id="chooseAction">
      <h1>🎴 Hardstuck</h1>
      <p style="margin:20px 0">A game of risk and timing</p>
      <button onclick="showCreate()">Create Room</button>
      <button onclick="showJoin()">Join Room</button>
    </div>

    <!-- Step 2a: Create Room (username) -->
    <div id="createPanel" class="hidden">
      <h2>Create Room</h2>
      <input id="createName" placeholder="Your username" maxlength="15" />
      <br/>
      <button onclick="createRoom()">Create</button>
      <button onclick="backToMain()">Back</button>
    </div>

    <!-- Step 2b: Join Room (username + code) -->
    <div id="joinPanel" class="hidden">
      <h2>Join Room</h2>
      <input id="joinName" placeholder="Your username" maxlength="15" />
      <input id="joinCode" placeholder="Room code" maxlength="10" style="text-transform:uppercase" />
      <br/>
      <button onclick="joinRoom()">Join</button>
      <button onclick="backToMain()">Back</button>
    </div>

    <!-- Waiting Room -->
    <div id="waitingArea" class="hidden">
      <h2>Room: <span id="roomDisplay" class="room-code"></span></h2>
      <p class="label">Share this code with friends</p>
      <ul id="playerList" style="list-style:none; margin:20px 0"></ul>
      <button id="startBtn" onclick="startGame()" class="hidden">Start Game</button>
      <p id="waitingMessage">Waiting for players...</p>
    </div>

    <!-- Game Area -->
    <div id="gameArea" class="hidden">
      <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:15px">
        <div>
          <strong>Turn:</strong> <span id="turnPlayer"></span>
        </div>
        <div>
          <span id="timerDisplay" class="timer">30s</span>
        </div>
      </div>

      <div style="background:#1e1e1e; border-radius:12px; padding:15px; margin:15px 0">
        <div style="display:flex; align-items:center; gap:20px">
          <div>
            <div class="label">Draw Pile</div>
            <div id="drawPile" class="card" style="background:#444; width:70px; height:90px; line-height:90px">?</div>
            <br/>
            <button id="drawBtn" onclick="drawCard()">Draw</button>
          </div>
          <div style="flex-grow:1">
            <div class="label">Discard Piles</div>
            <div id="discardPiles" style="display:flex; justify-content:center; gap:20px; margin-top:10px"></div>
          </div>
        </div>
      </div>

      <div id="playersArea"></div>
      <button onclick="leaveRoom()" style="margin-top:20px">Leave Game</button>
    </div>

    <!-- Game Over overlay will be injected -->
  </div>

  <!-- Firebase SDKs (compat) -->
  <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-database-compat.js"></script>

  <script>
    // ==============================================
    // YOUR FIREBASE CONFIG – REPLACE WITH YOUR OWN
    // ==============================================
    const firebaseConfig = {
      apiKey: "AIzaSyANEQA7aOltYtY-MHYwEpz17zzhBLppDBc",
      authDomain: "hardstuck-game.firebaseapp.com",
      databaseURL: "https://hardstuck-game-default-rtdb.firebaseio.com",
      projectId: "hardstuck-game",
      storageBucket: "hardstuck-game.firebasestorage.app",
      messagingSenderId: "1006298740610",
      appId: "1:1006298740610:web:5af1dec86271607eb3019b"
    };

    // Initialize Firebase
    firebase.initializeApp(firebaseConfig);
    const db = firebase.database();

    // ------- Global State -------
    let myPlayerId = null;
    let myName = '';
    let currentRoom = null;
    let timerInterval = null;
    window._gameState = null;
    window._turnOrder = [];

    // ------- UI Navigation -------
    function showCreate() {
      document.getElementById('chooseAction').classList.add('hidden');
      document.getElementById('createPanel').classList.remove('hidden');
    }

    function showJoin() {
      document.getElementById('chooseAction').classList.add('hidden');
      document.getElementById('joinPanel').classList.remove('hidden');
    }

    function backToMain() {
      document.getElementById('createPanel').classList.add('hidden');
      document.getElementById('joinPanel').classList.add('hidden');
      document.getElementById('chooseAction').classList.remove('hidden');
      // clear inputs
      document.getElementById('createName').value = '';
      document.getElementById('joinName').value = '';
      document.getElementById('joinCode').value = '';
    }

    function showWaitingRoom(roomCode) {
      document.getElementById('chooseAction').classList.add('hidden');
      document.getElementById('createPanel').classList.add('hidden');
      document.getElementById('joinPanel').classList.add('hidden');
      document.getElementById('waitingArea').classList.remove('hidden');
      document.getElementById('gameArea').classList.add('hidden');
      document.getElementById('roomDisplay').textContent = roomCode;
    }

    function showGameBoard() {
      document.getElementById('waitingArea').classList.add('hidden');
      document.getElementById('gameArea').classList.remove('hidden');
    }

    // ------- Room Actions -------
    function createRoom() {
      const name = document.getElementById('createName').value.trim();
      if (!name) return alert('Please enter a username.');
      myName = name;

      // Generate a random 4-letter room code
      const letters = 'ABCDEFGHIJKLMNOPQRSTUVWXYZ';
      let code = '';
      for (let i = 0; i < 4; i++) {
        code += letters[Math.floor(Math.random() * letters.length)];
      }
      currentRoom = code;

      // Check if room already exists (unlikely)
      db.ref(`rooms/${code}`).once('value', snap => {
        if (snap.exists()) {
          alert('Room code collision, trying again...');
          createRoom(); // retry
          return;
        }
        // Create room with host as first player
        const playerRef = db.ref(`rooms/${code}/players`).push();
        myPlayerId = playerRef.key;
        const updates = {};
        updates[`rooms/${code}/players/${myPlayerId}`] = { name, pile: [], ready: true };
        updates[`rooms/${code}/gameState/started`] = false;
        db.ref().update(updates).then(() => {
          showWaitingRoom(code);
          listenToRoom(code);
        }).catch(err => {
          alert('Failed to create room: ' + err.message);
        });
      });
    }

    function joinRoom() {
      const name = document.getElementById('joinName').value.trim();
      const code = document.getElementById('joinCode').value.trim().toUpperCase();
      if (!name || !code) return alert('Enter username and room code.');
      myName = name;
      currentRoom = code;

      // Check if room exists
      db.ref(`rooms/${code}`).once('value', snap => {
        if (!snap.exists()) {
          alert('Room not found.');
          return;
        }
        const data = snap.val();
        if (data.gameState && data.gameState.started) {
          alert('Game already started.');
          return;
        }
        // Add player to room
        const playerRef = db.ref(`rooms/${code}/players`).push();
        myPlayerId = playerRef.key;
        playerRef.set({ name, pile: [], ready: true }).then(() => {
          showWaitingRoom(code);
          listenToRoom(code);
        }).catch(err => {
          alert('Failed to join: ' + err.message);
        });
      });
    }

    function listenToRoom(room) {
      db.ref(`rooms/${room}`).on('value', snapshot => {
        const data = snapshot.val();
        if (!data) {
          // Room deleted
          alert('Room closed.');
          leaveRoom();
          return;
        }
        updateUI(data);
      });
    }

    // ------- Game Flow -------
    function startGame() {
      if (!currentRoom || !myPlayerId) return;
      db.ref(`rooms/${currentRoom}/players`).once('value', snap => {
        const players = snap.val();
        const playerIds = Object.keys(players);
        if (playerIds.length < 2) return alert('Need at least 2 players.');
        if (myPlayerId !== playerIds[0]) return alert('Only the room host can start.');

        db.ref(`rooms/${currentRoom}/gameState/started`).set(true);
        initializeGame(players);
      });
    }

    function initializeGame(players) {
      const playerIds = Object.keys(players);
      const playerCount = playerIds.length;
      let deckSize = 50;
      if (playerCount === 2) deckSize = 16;
      else if (playerCount === 3) deckSize = 28;
      else if (playerCount === 4) deckSize = 40;

      // Build and shuffle deck
      let deck = [];
      for (let i = 1; i <= 100; i++) deck.push(i);
      for (let i = deck.length - 1; i > 0; i--) {
        const j = Math.floor(Math.random() * (i + 1));
        [deck[i], deck[j]] = [deck[j], deck[i]];
      }
      deck = deck.slice(0, deckSize);

      const turnOrder = playerIds;
      const deadline = firebase.database.ServerValue.TIMESTAMP + 30000;

      const updates = {};
      updates[`rooms/${currentRoom}/gameState/deck`] = deck;
      updates[`rooms/${currentRoom}/gameState/discards`] = [[], [], []];
      updates[`rooms/${currentRoom}/gameState/currentPlayerIndex`] = 0;
      updates[`rooms/${currentRoom}/gameState/turnDeadline`] = deadline;
      updates[`rooms/${currentRoom}/gameState/phase`] = 'playing';
      updates[`rooms/${currentRoom}/gameState/winner`] = null;
      updates[`rooms/${currentRoom}/turnOrder`] = turnOrder;

      // Reset piles
      playerIds.forEach(pid => {
        updates[`rooms/${currentRoom}/players/${pid}/pile`] = [];
      });

      db.ref().update(updates);
    }

    // ------- Turn Actions -------
    function drawCard() {
      if (!isMyTurn()) return;
      db.ref(`rooms/${currentRoom}/gameState/deck`).once('value', deckSnap => {
        const deck = deckSnap.val() || [];
        if (deck.length === 0) return;
        const card = deck[0];
        const newDeck = deck.slice(1);

        db.ref(`rooms/${currentRoom}/players/${myPlayerId}/pile`).once('value', pileSnap => {
          const pile = pileSnap.val() || [];
          const topCard = pile.length > 0 ? pile[pile.length - 1] : null;

          if (pile.length === 0) {
            const keep = confirm(`You drew ${card}. Keep it as your starting card?`);
            const updates = {};
            updates[`rooms/${currentRoom}/gameState/deck`] = newDeck;
            if (keep) {
              pile.push(card);
              updates[`rooms/${currentRoom}/players/${myPlayerId}/pile`] = pile;
            } else {
              discardToPile(0, card);
            }
            db.ref().update(updates);
            endTurn();
          } else {
            if (card <= topCard) {
              alert(`Card ${card} is not higher than your top card ${topCard}. Discarded.`);
              const updates = {};
              updates[`rooms/${currentRoom}/gameState/deck`] = newDeck;
              discardToPile(1, card);
              db.ref().update(updates);
              endTurn();
            } else {
              const keep = confirm(`You drew ${card} (higher than ${topCard}). Keep it?`);
              const updates = {};
              updates[`rooms/${currentRoom}/gameState/deck`] = newDeck;
              if (keep) {
                pile.push(card);
                updates[`rooms/${currentRoom}/players/${myPlayerId}/pile`] = pile;
              } else {
                discardToPile(2, card);
              }
              db.ref().update(updates);
              endTurn();
            }
          }
        });
      });
    }

    function discardToPile(pileIndex, card) {
      const discRef = db.ref(`rooms/${currentRoom}/gameState/discards/${pileIndex}`);
      discRef.transaction(disc => {
        if (disc === null) disc = [];
        disc.push(card);
        return disc;
      });
    }

    function takeDiscard(pileIndex) {
      if (!isMyTurn()) return;
      db.ref(`rooms/${currentRoom}/gameState/discards/${pileIndex}`).once('value', discSnap => {
        const disc = discSnap.val() || [];
        if (disc.length === 0) return alert('That discard pile is empty.');
        const card = disc[disc.length - 1];

        db.ref(`rooms/${currentRoom}/players/${myPlayerId}/pile`).once('value', pileSnap => {
          const pile = pileSnap.val() || [];
          const topCard = pile.length > 0 ? pile[pile.length - 1] : null;

          if (pile.length > 0 && card <= topCard) {
            return alert('Card is not higher than your top card.');
          }

          pile.push(card);
          const newDisc = disc.slice(0, -1);
          const updates = {};
          updates[`rooms/${currentRoom}/players/${myPlayerId}/pile`] = pile;
          updates[`rooms/${currentRoom}/gameState/discards/${pileIndex}`] = newDisc;
          db.ref().update(updates);
          endTurn();
        });
      });
    }

    function endTurn() {
      db.ref(`rooms/${currentRoom}/gameState`).once('value', snap => {
        const gs = snap.val();
        if (!gs || !gs.turnOrder) return;
        const turnOrder = gs.turnOrder;
        const playerCount = turnOrder.length;
        if (playerCount === 0) return;
        const nextIndex = (gs.currentPlayerIndex + 1) % playerCount;
        const newDeadline = firebase.database.ServerValue.TIMESTAMP + 30000;

        const updates = {};
        updates[`rooms/${currentRoom}/gameState/currentPlayerIndex`] = nextIndex;
        updates[`rooms/${currentRoom}/gameState/turnDeadline`] = newDeadline;
        db.ref().update(updates);

        // End game if deck empty
        const deck = gs.deck || [];
        if (deck.length === 0 && gs.phase !== 'ended') {
          endGame(gs);
        }
      });
    }

    function skipTurn() {
      if (!isMyTurn()) return;
      alert('Time’s up! Turn skipped.');
      endTurn();
    }

    function endGame(gs) {
      db.ref(`rooms/${currentRoom}/players`).once('value', playersSnap => {
        const players = playersSnap.val();
        let maxCards = -1;
        let winnerId = null;
        let winnerTop = 101;

        for (let pid in players) {
          const pile = players[pid].pile || [];
          const count = pile.length;
          const top = count > 0 ? pile[count - 1] : 0;
          if (count > maxCards || (count === maxCards && top < winnerTop)) {
            maxCards = count;
            winnerId = pid;
            winnerTop = top;
          }
        }

        const updates = {};
        updates[`rooms/${currentRoom}/gameState/phase`] = 'ended';
        updates[`rooms/${currentRoom}/gameState/winner`] = winnerId;
        db.ref().update(updates);
      });
    }

    function isMyTurn() {
      const gs = window._gameState;
      const order = window._turnOrder;
      if (!gs || !myPlayerId || !order) return false;
      const currentId = order[gs.currentPlayerIndex];
      return currentId === myPlayerId;
    }

    // ------- UI Update -------
    function updateUI(data) {
      if (!data) return;
      const players = data.players || {};
      const gs = data.gameState || {};

      window._gameState = gs;
      window._turnOrder = data.turnOrder || Object.keys(players);

      if (!gs.started) {
        // Waiting room
        const playerIds = Object.keys(players);
        document.getElementById('playerList').innerHTML = playerIds
          .map(pid => `<li>👤 ${players[pid].name}</li>`)
          .join('');
        const hostId = playerIds[0];
        if (playerIds.length >= 2 && myPlayerId === hostId) {
          document.getElementById('startBtn').classList.remove('hidden');
          document.getElementById('waitingMessage').classList.add('hidden');
        } else {
          document.getElementById('startBtn').classList.add('hidden');
          document.getElementById('waitingMessage').classList.remove('hidden');
        }
        showWaitingRoom(currentRoom); // make sure waiting room is visible
      } else if (gs.phase === 'ended') {
        const winner = players[gs.winner];
        const winnerName = winner ? winner.name : 'Unknown';
        document.getElementById('gameArea').innerHTML = `
          <div style="background:#1e1e1e; border-radius:12px; padding:30px; margin-top:50px">
            <h2>🏆 Game Over</h2>
            <p style="font-size:1.5rem">Winner: <strong>${winnerName}</strong></p>
            <button onclick="leaveRoom()">Leave</button>
          </div>`;
        showGameBoard();
      } else {
        // Playing
        updateGameUI(players, gs);
        showGameBoard();
      }
    }

    function updateGameUI(players, gs) {
      const turnOrder = window._turnOrder;
      const currentId = turnOrder[gs.currentPlayerIndex];
      document.getElementById('turnPlayer').textContent = players[currentId] ? players[currentId].name : '?';

      // Timer
      const deadline = gs.turnDeadline || 0;
      updateTimer(deadline);

      // Draw pile
      const deck = gs.deck || [];
      const drawPileDiv = document.getElementById('drawPile');
      drawPileDiv.textContent = deck.length > 0 ? '?' : '0';
      drawPileDiv.style.background = deck.length > 0 ? '#444' : '#222';
      document.getElementById('drawBtn').disabled = !isMyTurn() || deck.length === 0;

      // Discard piles
      const discards = gs.discards || [[], [], []];
      const discDiv = document.getElementById('discardPiles');
      discDiv.innerHTML = '';
      for (let i = 0; i < 3; i++) {
        const pile = discards[i] || [];
        const top = pile.length > 0 ? pile[pile.length - 1] : null;
        const div = document.createElement('div');
        div.className = 'discard-pile';
        div.innerHTML = `
          <div class="card" style="background:${top ? valueToColor(top) : '#333'}; width:60px; height:80px; line-height:80px">
            ${top !== null ? top : '-'}
          </div>
          <br/>
          <button onclick="takeDiscard(${i})" ${!isMyTurn() ? 'disabled' : ''}>Take</button>
        `;
        discDiv.appendChild(div);
      }

      // Players' areas
      const area = document.getElementById('playersArea');
      area.innerHTML = '';
      for (let pid of turnOrder) {
        const player = players[pid];
        const pile = player.pile || [];
        const div = document.createElement('div');
        div.className = 'player-area';
        div.innerHTML = `<div class="player-name">${player.name} <span class="label">(${pile.length} cards)</span></div>`;
        const cardsDiv = document.createElement('div');
        pile.forEach(val => {
          const cardEl = document.createElement('span');
          cardEl.className = 'card';
          cardEl.style.background = valueToColor(val);
          cardEl.textContent = val;
          cardsDiv.appendChild(cardEl);
        });
        div.appendChild(cardsDiv);
        area.appendChild(div);
      }
    }

    function valueToColor(value) {
      // 1 → blue (240°), 100 → pink (330°)
      const hue = 240 - ((value - 1) * 90 / 99);
      return `hsl(${hue}, 70%, 60%)`;
    }

    function updateTimer(deadline) {
      clearInterval(timerInterval);
      if (!deadline) {
        document.getElementById('timerDisplay').textContent = '--';
        return;
      }

      const tick = () => {
        const now = Date.now();
        const remaining = Math.max(0, deadline - now);
        document.getElementById('timerDisplay').textContent = Math.ceil(remaining / 1000) + 's';
        if (remaining <= 0) {
          clearInterval(timerInterval);
          if (isMyTurn()) {
            skipTurn();
          }
        }
      };
      tick();
      timerInterval = setInterval(tick, 1000);
    }

    function leaveRoom() {
      if (currentRoom && myPlayerId) {
        db.ref(`rooms/${currentRoom}/players/${myPlayerId}`).remove();
        db.ref(`rooms/${currentRoom}`).off();
      }
      clearInterval(timerInterval);
      currentRoom = null;
      myPlayerId = null;
      window._gameState = null;
      window._turnOrder = [];
      // Reset all UI panels
      document.getElementById('chooseAction').classList.remove('hidden');
      document.getElementById('createPanel').classList.add('hidden');
      document.getElementById('joinPanel').classList.add('hidden');
      document.getElementById('waitingArea').classList.add('hidden');
      document.getElementById('gameArea').classList.add('hidden');
      document.getElementById('gameArea').innerHTML = `
        <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:15px">
          <div><strong>Turn:</strong> <span id="turnPlayer"></span></div>
          <div><span id="timerDisplay" class="timer">30s</span></div>
        </div>
        <div style="background:#1e1e1e; border-radius:12px; padding:15px; margin:15px 0">
          <div style="display:flex; align-items:center; gap:20px">
            <div>
              <div class="label">Draw Pile</div>
              <div id="drawPile" class="card" style="background:#444; width:70px; height:90px; line-height:90px">?</div>
              <br/>
              <button id="drawBtn" onclick="drawCard()">Draw</button>
            </div>
            <div style="flex-grow:1">
              <div class="label">Discard Piles</div>
              <div id="discardPiles" style="display:flex; justify-content:center; gap:20px; margin-top:10px"></div>
            </div>
          </div>
        </div>
        <div id="playersArea"></div>
        <button onclick="leaveRoom()" style="margin-top:20px">Leave Game</button>
      `;
    }
  </script>
</body>
</html>
