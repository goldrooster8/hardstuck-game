<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Hardstuck Gauntlet</title>
  <script src="https://www.gstatic.com/firebasejs/10.12.5/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.5/firebase-auth-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.5/firebase-database-compat.js"></script>
  <style>
    :root {
      color-scheme: dark;
      --bg: #050507;
      --panel: #101015;
      --panel-2: #17171f;
      --line: #2b2b37;
      --text: #f5f5f7;
      --muted: #a6a6b3;
      --accent: #54d6a4;
      --danger: #ff6a7a;
      --warn: #ffd166;
      --shadow: 0 18px 50px rgba(0, 0, 0, .42);
    }
    * { box-sizing: border-box; }
    html, body { height: 100%; }
    body {
      margin: 0;
      min-height: 100%;
      background: radial-gradient(circle at 50% 35%, rgba(60, 76, 95, .18), transparent 34rem), linear-gradient(180deg, #0a0a0e 0%, var(--bg) 100%);
      color: var(--text);
      font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    }
    button, input {
      font: inherit;
      letter-spacing: 0;
    }
    button {
      border: 1px solid var(--line);
      border-radius: 8px;
      color: var(--text);
      background: #1d1d27;
      min-height: 42px;
      padding: 0 16px;
      cursor: pointer;
      transition: transform .14s ease, border-color .14s ease, background .14s ease, opacity .14s ease;
    }
    button:hover:enabled {
      transform: translateY(-1px);
      border-color: #505064;
      background: #252532;
    }
    button:disabled {
      cursor: not-allowed;
      opacity: .42;
    }
    .primary {
      background: linear-gradient(180deg, #43bd91, #25986f);
      border-color: #64e4b2;
      color: #03110c;
      font-weight: 800;
    }
    .danger {
      background: #321922;
      border-color: #734050;
      color: #ffdce2;
    }
    .ghost { background: transparent; }
    input {
      width: 100%;
      min-height: 44px;
      border: 1px solid var(--line);
      border-radius: 8px;
      padding: 0 12px;
      outline: none;
      background: #0c0c12;
      color: var(--text);
    }
    input:focus { border-color: var(--accent); }
    .screen {
      display: none;
      min-height: 100vh;
      padding: 24px;
    }
    .screen.active { display: block; }
    .shell {
      width: min(560px, 100%);
      margin: 8vh auto 0;
    }
    .title {
      font-size: clamp(46px, 8vw, 86px);
      line-height: .92;
      margin: 0 0 12px;
      font-weight: 950;
    }
    .subtitle {
      color: var(--muted);
      margin: 0 0 28px;
      font-size: 17px;
    }
    .panel {
      background: rgba(16, 16, 21, .94);
      border: 1px solid var(--line);
      border-radius: 8px;
      padding: 20px;
      box-shadow: var(--shadow);
    }
    .stack { display: grid; gap: 14px; }
    .row { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; }
    .row > * { flex: 1 1 auto; }
    .muted { color: var(--muted); }
    .error { color: #ff97a4; min-height: 22px; }
    .room-code {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      min-width: 150px;
      min-height: 64px;
      border: 1px solid #56566b;
      border-radius: 8px;
      font-size: 42px;
      font-weight: 950;
      letter-spacing: .08em;
      background: #0b0b10;
    }
    .players-list {
      display: grid;
      gap: 8px;
      margin: 0;
      padding: 0;
      list-style: none;
    }
    .players-list li {
      display: flex;
      justify-content: space-between;
      gap: 12px;
      padding: 10px 12px;
      border: 1px solid var(--line);
      border-radius: 8px;
      background: #111118;
    }
    .game {
      min-height: 100vh;
      padding: 16px;
      position: relative;
      overflow: hidden;
    }
    .topbar {
      position: relative;
      z-index: 4;
      display: grid;
      grid-template-columns: auto 1fr auto;
      align-items: center;
      gap: 14px;
      min-height: 58px;
    }
    .topbar .left-buttons { display: flex; gap: 10px; }
    .status {
      justify-self: center;
      text-align: center;
      display: grid;
      gap: 3px;
    }
    .turn { font-size: 22px; font-weight: 850; }
    .timer {
      justify-self: end;
      min-width: 74px;
      text-align: center;
      border: 1px solid var(--line);
      border-radius: 8px;
      padding: 9px 12px;
      background: #111118;
      font-weight: 900;
      font-variant-numeric: tabular-nums;
    }
    .table {
      position: relative;
      height: calc(100vh - 90px);
      min-height: 620px;
    }
    .center {
      position: absolute;
      left: 50%;
      top: 46%;
      transform: translate(-50%, -50%);
      width: min(520px, 86vw);
      display: grid;
      gap: 16px;
      justify-items: center;
      z-index: 2;
    }
    .draw-discard-group {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 18px;
      width: 100%;
    }
    .deck-zone {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 8px;
    }
    .discard-row {
      display: flex;
      justify-content: center;
      gap: 24px;
      flex-wrap: wrap;
      align-items: flex-start;
    }
    .discard-zone {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 8px;
    }
    .card {
      width: 72px;
      height: 100px;
      border-radius: 8px;
      display: grid;
      place-items: center;
      color: white;
      font-weight: 950;
      font-size: 28px;
      border: 1px solid rgba(255,255,255,.28);
      box-shadow: 0 12px 26px rgba(0,0,0,.36);
      text-shadow: 0 1px 2px rgba(0,0,0,.65);
      user-select: none;
    }
    .card.back {
      background: linear-gradient(135deg, rgba(255,255,255,.08) 25%, transparent 25%) 0 0 / 16px 16px, linear-gradient(315deg, rgba(255,255,255,.06) 25%, transparent 25%) 0 0 / 16px 16px, #20202b;
      color: #d7d7e6;
    }
    .empty-card {
      border: 1px dashed #454557;
      background: rgba(255,255,255,.03);
      color: #707082;
      box-shadow: none;
    }
    .pile-label { color: var(--muted); font-size: 13px; min-height: 18px; }
    .drawn-zone {
      position: absolute;
      z-index: 20;
      padding: 14px;
      border: 1px solid var(--line);
      border-radius: 8px;
      background: rgba(17, 17, 24, .94);
      box-shadow: var(--shadow);
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 8px;
      max-width: 200px;
    }
    .drawn-actions { display: flex; gap: 10px; flex-wrap: wrap; justify-content: center; }
    .player {
      position: absolute;
      width: 230px;
      max-width: 32vw;
      transform: translate(-50%, -50%);
      padding: 10px;
      border: 1px solid var(--line);
      border-radius: 8px;
      background: rgba(13, 13, 18, .9);
      box-shadow: 0 10px 28px rgba(0,0,0,.3);
      z-index: 1;
    }
    .player.me { border-color: #5fd3aa; }
    .player.active-player { box-shadow: 0 0 0 2px rgba(84, 214, 164, .7), 0 14px 32px rgba(0,0,0,.38); }
    .player-head {
      display: flex;
      justify-content: space-between;
      gap: 8px;
      align-items: baseline;
      margin-bottom: 8px;
      min-width: 0;
    }
    .player-name {
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
      font-weight: 850;
    }
    .count {
      color: var(--muted);
      font-size: 13px;
      flex: 0 0 auto;
    }
    .mini-cards {
      min-height: 34px;
      display: flex;
      flex-wrap: wrap;
      gap: 5px;
      align-items: center;
    }
    .mini-card {
      width: 30px;
      height: 38px;
      border-radius: 5px;
      display: grid;
      place-items: center;
      color: white;
      font-size: 12px;
      font-weight: 900;
      border: 1px solid rgba(255,255,255,.24);
      text-shadow: 0 1px 1px rgba(0,0,0,.6);
    }
    .fly-card {
      position: fixed;
      z-index: 30;
      pointer-events: none;
      transition: transform .42s cubic-bezier(.2, .86, .28, 1), opacity .42s ease;
      will-change: transform, opacity;
    }
    .ended, .shop-screen {
      position: fixed;
      inset: 0;
      display: none;
      place-items: center;
      z-index: 10;
      background: rgba(0, 0, 0, .72);
      padding: 20px;
    }
    .ended.active, .shop-screen.active { display: grid; }
    .results, .shop-panel { width: min(540px, 100%); }
    .shop-item {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 10px;
      border-bottom: 1px solid var(--line);
    }
    .shop-item button { flex-shrink: 0; }
    @media (max-width: 760px) {
      .screen { padding: 16px; }
      .game { padding: 10px; overflow: auto; }
      .topbar { grid-template-columns: auto 1fr auto; align-items: start; }
      .status { grid-column: 1 / -1; order: 2; }
      .timer { justify-self: end; }
      .table { height: auto; min-height: 980px; }
      .center { top: 420px; width: min(100%, 430px); }
      .player { width: 44vw; max-width: 190px; }
      .card { width: 62px; height: 86px; font-size: 24px; }
      button { padding: 0 12px; }
    }
  </style>
</head>
<body>
  <main id="home" class="screen active">
    <section class="shell">
      <h1 class="title">Hardstuck Gauntlet</h1>
      <p class="subtitle">Multi‑round chaos. Buy upgrades. Become unstuck.</p>
      <div class="panel stack">
        <div class="row">
          <button id="showCreate" class="primary">Create Room</button>
          <button id="showJoin">Join Room</button>
        </div>
        <form id="createForm" class="stack" hidden>
          <input id="createName" maxlength="24" placeholder="Username" required>
          <button class="primary" type="submit">Create</button>
        </form>
        <form id="joinForm" class="stack" hidden>
          <input id="joinName" maxlength="24" placeholder="Username" required>
          <input id="joinCode" maxlength="4" autocapitalize="characters" placeholder="Room code" required>
          <button class="primary" type="submit">Join</button>
        </form>
        <div id="homeError" class="error"></div>
      </div>
    </section>
  </main>
  <main id="lobby" class="screen">
    <section class="shell">
      <h1 class="title">Room</h1>
      <div class="panel stack">
        <div><div class="muted">Share this code</div><div id="roomCode" class="room-code"></div></div>
        <ul id="lobbyPlayers" class="players-list"></ul>
        <div class="row">
          <button id="startGame" class="primary" disabled>Start Gauntlet</button>
          <button id="leaveLobby" class="ghost">Leave</button>
        </div>
        <div id="lobbyError" class="error"></div>
      </div>
    </section>
  </main>
  <main id="game" class="screen game">
    <header class="topbar">
      <div class="left-buttons">
        <button id="copyRoom" class="ghost">Room <span id="gameRoomCode"></span></button>
        <button id="leaveGame" class="ghost">Leave</button>
      </div>
      <div class="status">
        <div id="turnText" class="turn">Waiting</div>
        <div id="phaseText" class="muted"></div>
      </div>
      <div id="timer" class="timer">30s</div>
    </header>
    <section id="table" class="table">
      <div id="playersRing"></div>
      <div class="center">
        <div class="draw-discard-group">
          <div class="deck-zone">
            <div id="deckCard" class="card back">?</div>
            <button id="drawBtn" class="primary">Draw</button>
            <div id="deckCount" class="pile-label"></div>
          </div>
          <div id="discards" class="discard-row"></div>
        </div>
      </div>
    </section>
    <div id="drawnZone" class="drawn-zone" hidden>
      <div class="pile-label">Drawn card</div>
      <div id="drawnCard" class="card"></div>
      <div id="drawnHint" class="muted"></div>
      <div class="drawn-actions" id="drawnActions">
        <button id="keepBtn" class="primary">Keep</button>
        <button id="discardBtn" class="danger">Discard</button>
        <button id="destroyBtn" class="danger" hidden>Destroy</button>
      </div>
    </div>
    <div id="shopScreen" class="shop-screen">
      <div class="panel shop-panel stack">
        <h2 style="margin:0">Shop Phase</h2>
        <div id="shopCoins"></div>
        <div id="shopItems"></div>
        <button id="shopReady" class="primary">Ready</button>
      </div>
    </div>
    <div id="ended" class="ended">
      <div class="panel results stack">
        <h2 style="margin:0;font-size:32px;">Game Over</h2>
        <div id="winnerText"></div>
        <ul id="resultsList" class="players-list"></ul>
        <button id="backHome" class="primary">Back to Start</button>
      </div>
    </div>
  </main>

  <script>
    const firebaseConfig = {
      apiKey: "AIzaSyANEQA7aOltYtY-MHYwEpz17zzhBLppDBc",
      authDomain: "hardstuck-game.firebaseapp.com",
      databaseURL: "https://hardstuck-game-default-rtdb.asia-southeast1.firebasedatabase.app",
      projectId: "hardstuck-game",
      storageBucket: "hardstuck-game.firebasestorage.app",
      messagingSenderId: "1006298740610",
      appId: "1:1006298740610:web:5af1dec86271607eb3019b"
    };
    firebase.initializeApp(firebaseConfig);
    const auth = firebase.auth();
    const db = firebase.database();

    const TURN_MS = 30000, TOTAL_ROUNDS = 3;
    const UPGRADES = [
      { id: "plus20", name: "Overclock", desc: "+20 to drawn card for 2 turns (once/round)", cost: 3 },
      { id: "reroll", name: "Reroll", desc: "Reroll drawn card (first free, then -1 coin)", cost: 3 },
      { id: "riskIt", name: "Risk It", desc: "1/7 chance each draw to risk it all (once/round)", cost: 4 },
      { id: "destroy", name: "Destroy", desc: "Destroy drawn card instead of discarding (once/round)", cost: 3 },
      { id: "reverse", name: "Reverse Digits", desc: "Flip digits of a card in your pile (once/round)", cost: 4 },
      { id: "chaosPile", name: "Chaos Pile", desc: "Destroy 2 random cards, keep 2nd lowest (once/round, need 4 cards)", cost: 3 },
      { id: "lowStart", name: "Low Start", desc: "First draw always < 40", cost: 2 },
      { id: "placebo", name: "Placebo", desc: "Does absolutely nothing", cost: 1 },
      { id: "stealHigh", name: "Highway Robbery", desc: "If top > 80, steal opponent's top after turn (once/round)", cost: 5 },
      { id: "poison", name: "Poison Gift", desc: "+15 to opponent's top card before your turn (once/round)", cost: 3 }
    ];

    const state = {
      uid: null,
      playerKey: localStorage.getItem("hsPlayerKey") || null,
      roomCode: localStorage.getItem("hsRoomCode") || null,
      isCreator: false,
      room: null,
      serverOffset: 0,
      discardMode: false,
      timerId: null,
      roomRef: null,
      previousRoom: null,
      seenDrawnKey: null,
      lastDrawnRect: null,
      riskUsedThisRound: false,
      plus20Turns: 0,
      rerollsUsed: 0,
      reverseUsed: false,
      chaosPileUsed: false,
      destroyUsed: false,
      stealHighUsed: false,
      poisonUsed: false,
      shopReady: false
    };

    const $ = id => document.getElementById(id);

    function showScreen(name) {
      document.querySelectorAll('.screen').forEach(el => el.classList.remove('active'));
      $(name).classList.add('active');
    }

    function cardColor(v) {
      const hue = 240 - ((Number(v) - 1) * 90 / 99);
      return `hsl(${hue}, 70%, 60%)`;
    }

    function randomCode() {
      const letters = "ABCDEFGHJKLMNPQRSTUVWXYZ";
      return Array.from({length:4}, () => letters[Math.floor(Math.random()*letters.length)]).join('');
    }

    function shuffle(arr) { const a = arr.slice(); for (let i = a.length-1; i>0; i--) { const j = Math.floor(Math.random()*(i+1)); [a[i],a[j]] = [a[j],a[i]]; } return a; }

    function deckSizeFor(count) {
      if (count <= 2) return 16; if (count === 3) return 28; if (count === 4) return 40; return 50;
    }

    function topCard(player) {
      const pile = Array.isArray(player?.pile) ? player.pile : [];
      return pile.length ? Math.max(...pile) : null;
    }

    function canKeep(card, player) {
      const top = topCard(player);
      return top === null || Number(card) > top;
    }

    function validDiscardIndexes(discards) {
      const piles = (discards || []).map((p,i) => Array.isArray(p) ? p : []);
      const hasEmpty = piles.some(p => p.length === 0);
      return piles.map((p,i) => (!hasEmpty || p.length === 0 ? i : -1)).filter(i => i >= 0);
    }

    function normalizeDiscards(d) { return [0,1,2].map(i => Array.isArray(d?.[i]) ? d[i] : []); }

    function playersArray(room) {
      const players = room?.players || {};
      const order = Array.isArray(room?.turnOrder) ? room.turnOrder : Object.keys(players);
      return order.filter(id => players[id]).map(id => ({ id, ...players[id] }));
    }

    function currentPlayerId(gs) {
      const order = Array.isArray(state.room?.turnOrder) ? state.room.turnOrder : [];
      return order[Number(gs?.currentPlayerIndex) || 0] || null;
    }

    function nowServer() { return Date.now() + state.serverOffset; }

    function nextTurn(gs, orderLen) {
      return {
        currentPlayerIndex: (Number(gs.currentPlayerIndex||0) + 1) % orderLen,
        turnPhase: "action",
        drawnCard: null,
        turnDeadline: nowServer() + TURN_MS
      };
    }

    function endRoundPatch(gs, room) {
      const players = playersArray(room);
      const ranked = players.slice().sort((a,b) => (b.pile?.length||0) - (a.pile?.length||0) || (topCard(a)??Infinity) - (topCard(b)??Infinity));
      const winner = ranked[0]?.id || null;
      // Award coins: 3 each, +1 for lowest top card
      const lowestTop = Math.min(...players.map(p => topCard(p) ?? Infinity));
      const bonusIds = players.filter(p => (topCard(p)??Infinity) === lowestTop).map(p => p.id);
      const coinUpdates = {};
      players.forEach(p => {
        let coins = (p.coins || 0) + 3;
        if (bonusIds.includes(p.id)) coins += 1;
        coinUpdates[p.id] = coins;
      });
      // Store round results
      const roundResults = gs.roundResults || {};
      roundResults[gs.round] = players.map(p => ({ id: p.id, cards: p.pile?.length||0, top: topCard(p) }));
      return {
        phase: gs.round >= TOTAL_ROUNDS ? "ended" : "shop",
        winner: gs.round >= TOTAL_ROUNDS ? winner : null,
        roundResults,
        coinUpdates,
        turnPhase: "action",
        drawnCard: null,
        turnDeadline: firebase.database.ServerValue.TIMESTAMP
      };
    }

    function advanceOrEnd(gs, room) {
      if (!Array.isArray(gs.deck) || gs.deck.length === 0) return endRoundPatch(gs, room);
      return nextTurn(gs, (room.turnOrder||[]).length);
    }

    async function createRoom(name) {
      setError("homeError","");
      let code = randomCode();
      for (let i=0;i<12;i++) { if (!(await db.ref(`rooms/${code}`).get()).exists()) break; code = randomCode(); }
      const ref = db.ref(`rooms/${code}`);
      const playerRef = ref.child("players").push();
      await ref.set({
        players: { [playerRef.key]: { name: name.trim().slice(0,24)||"Player", pile:[], coins:0, upgrades:[] } },
        creator: playerRef.key,
        gameState: { started:false, deck:[], discards:[[],[],[]], currentPlayerIndex:0, turnPhase:"action", drawnCard:null, turnDeadline:firebase.database.ServerValue.TIMESTAMP, phase:"lobby", round:1, roundResults:{}, shopOpen:false },
        turnOrder:[]
      });
      enterRoom(code, playerRef.key, true);
    }

    async function joinRoom(code, name) {
      setError("homeError","");
      code = code.toUpperCase().replace(/[^A-Z]/g,'').slice(0,4);
      if (code.length!==4) throw new Error("4-letter code.");
      const ref = db.ref(`rooms/${code}`);
      const snap = await ref.get();
      if (!snap.exists()) throw new Error("Room not found.");
      if (snap.val().gameState?.started) throw new Error("Game already started.");
      const playerRef = ref.child("players").push();
      await playerRef.set({ name: name.trim().slice(0,24)||"Player", pile:[], coins:0, upgrades:[] });
      enterRoom(code, playerRef.key, false);
    }

    function enterRoom(code, key, creator) {
      state.roomCode = code; state.playerKey = key; state.isCreator = creator;
      localStorage.setItem("hsRoomCode", code); localStorage.setItem("hsPlayerKey", key);
      attachRoom();
    }

    function attachRoom() {
      if (state.roomRef) state.roomRef.off();
      state.roomRef = db.ref(`rooms/${state.roomCode}`);
      state.roomRef.on("value", snap => {
        const prev = state.room;
        state.room = snap.val();
        if (!state.room) { localStorage.clear(); showScreen("home"); return; }
        const gs = state.room.gameState;
        if (gs?.started) {
          showScreen("game");
          if (gs.phase === "shop") renderShop();
          else if (gs.phase === "ended") renderFinalResults();
          else renderGame();
          detectAnimations(prev, state.room);
        } else {
          showScreen("lobby");
          renderLobby();
        }
        state.previousRoom = state.room;
      });
    }

    function renderLobby() {
      $("roomCode").textContent = state.roomCode;
      const players = playersArray(state.room);
      $("lobbyPlayers").innerHTML = players.map((p,i) => `<li>${i+1}. ${escapeHtml(p.name)} ${p.id===state.playerKey?'(you)':''}</li>`).join('');
      const isCreator = state.room?.creator === state.playerKey;
      $("startGame").hidden = !isCreator;
      $("startGame").disabled = !isCreator || players.length < 2;
    }

    function renderGame() {
      const room = state.room || {};
      const gs = room.gameState || {};
      const players = playersArray(room);
      const me = room.players?.[state.playerKey];
      const currentId = currentPlayerId(gs);
      const myTurn = currentId === state.playerKey && gs.phase === "playing";
      const current = currentId && room.players?.[currentId];
      $("gameRoomCode").textContent = `${state.roomCode} (R${gs.round}/${TOTAL_ROUNDS})`;
      $("turnText").textContent = `${current?.name||'Player'}'s turn`;
      $("phaseText").textContent = gs.turnPhase === "deciding" ? "Choose keep/discard" : (myTurn ? "Your move" : "");
      $("deckCount").textContent = `${gs.deck?.length||0} in deck`;
      $("drawBtn").hidden = !(myTurn && gs.turnPhase==="action");
      $("drawBtn").disabled = !(myTurn && gs.turnPhase==="action" && gs.deck?.length>0);
      renderDiscards(gs, me, myTurn);
      renderPlayers(players, currentId);
      renderDrawn(gs, me, myTurn, currentId);
      startTimer();
    }

    function renderDiscards(gs, me, myTurn) {
      const wrap = $("discards"); wrap.innerHTML = "";
      normalizeDiscards(gs.discards).forEach((pile, i) => {
        const top = pile.length ? pile[pile.length-1] : null;
        const zone = document.createElement("div"); zone.className = "discard-zone";
        zone.dataset.discardIndex = i;
        zone.appendChild(makeCard(top, "card"));
        const btn = document.createElement("button");
        if (state.discardMode) {
          btn.textContent = "Discard here";
          btn.hidden = !(myTurn && gs.turnPhase==="deciding");
          btn.disabled = !(myTurn && gs.turnPhase==="deciding" && validDiscardIndexes(gs.discards).includes(i));
          btn.onclick = () => discardDrawn(i);
        } else {
          btn.textContent = "Take";
          const can = myTurn && gs.turnPhase==="action" && canTake(top, me);
          btn.hidden = !can; btn.disabled = !can;
          btn.onclick = () => takeDiscard(i);
        }
        zone.appendChild(btn);
        zone.appendChild(Object.assign(document.createElement("div"),{className:"pile-label",textContent:`Discard ${i+1}`}));
        wrap.appendChild(zone);
      });
    }

    function renderPlayers(players, currentId) {
      const ring = $("playersRing"); ring.innerHTML = "";
      const mobile = matchMedia("(max-width:760px)").matches;
      const rx = mobile ? 37 : 43, ry = mobile ? 40 : 39;
      const meIdx = players.findIndex(p => p.id === state.playerKey);
      const visual = players.slice(meIdx).concat(players.slice(0, meIdx));
      visual.forEach((p, i) => {
        const angle = 90 + (360 * i / visual.length);
        const x = 50 + rx * Math.cos(angle * Math.PI/180);
        const y = 50 + ry * Math.sin(angle * Math.PI/180);
        const el = document.createElement("article");
        el.className = `player${p.id===state.playerKey?' me':''}${p.id===currentId?' active-player':''}`;
        el.dataset.playerId = p.id;
        el.style.left = `${x}%`; el.style.top = `${y}%`;
        const pile = (p.pile||[]).slice().sort((a,b)=>a-b);
        el.innerHTML = `<div class="player-head"><div class="player-name">${escapeHtml(p.name)}</div><div class="count">${pile.length} cards${topCard(p)!=null?` - top ${topCard(p)}`:''}</div></div><div class="mini-cards"></div>`;
        const minis = el.querySelector(".mini-cards");
        pile.forEach(v => minis.appendChild(makeMiniCard(v)));
        ring.appendChild(el);
      });
    }

    function renderDrawn(gs, me, myTurn, currentId) {
      const zone = $("drawnZone");
      const has = gs.turnPhase==="deciding" && gs.drawnCard!=null;
      zone.hidden = !has;
      if (!has) { state.discardMode = false; return; }
      $("drawnCard").replaceWith(makeCard(gs.drawnCard, "card")); document.querySelector("#drawnZone .card").id = "drawnCard";
      state.lastDrawnRect = $("drawnCard").getBoundingClientRect();
      const allowed = canKeep(gs.drawnCard, me);
      $("drawnHint").textContent = allowed ? "Keep or discard" : "Must discard";
      $("keepBtn").hidden = !(myTurn && !state.discardMode);
      $("discardBtn").hidden = !(myTurn && !state.discardMode);
      $("keepBtn").disabled = !(myTurn && allowed && !state.discardMode);
      $("discardBtn").disabled = !(myTurn && !state.discardMode);
      $("destroyBtn").hidden = !(myTurn && me?.upgrades?.includes("destroy") && !state.destroyUsed);
      $("destroyBtn").disabled = !(myTurn && !state.discardMode);
      const playerEl = document.querySelector(`.player[data-player-id="${currentId}"]`);
      const gameEl = $("game");
      if (playerEl && gameEl) {
        const gr = gameEl.getBoundingClientRect(), pr = playerEl.getBoundingClientRect();
        let left = pr.right - gr.left + 16, top = pr.top - gr.top;
        if (left + (zone.offsetWidth||200) > gr.width) left = pr.left - gr.left - (zone.offsetWidth||200) - 16;
        left = Math.max(8, left); top = Math.max(8, Math.min(top, gr.height - (zone.offsetHeight||120) - 8));
        zone.style.cssText = `left:${left}px;top:${top}px;right:auto;bottom:auto;transform:none;`;
      }
    }

    function renderShop() {
      const room = state.room, gs = room.gameState, me = room.players?.[state.playerKey];
      $("shopScreen").classList.add("active");
      $("shopCoins").textContent = `Your coins: ${me?.coins||0}`;
      const itemsDiv = $("shopItems"); itemsDiv.innerHTML = "";
      const shopUpgrades = gs.shopUpgrades || UPGRADES.slice(0,6); // host sets random 6 each shop
      shopUpgrades.forEach(u => {
        const div = document.createElement("div"); div.className = "shop-item";
        div.innerHTML = `<div><strong>${u.name}</strong><br><span class="muted">${u.desc}</span></div><div>${u.cost} coins</div>`;
        const btn = document.createElement("button");
        btn.textContent = me?.upgrades?.includes(u.id) ? "Owned" : "Buy";
        btn.disabled = me?.upgrades?.includes(u.id) || (me?.coins||0) < u.cost || state.shopReady;
        btn.onclick = async () => { await buyUpgrade(u.id); };
        div.appendChild(btn);
        itemsDiv.appendChild(div);
      });
      $("shopReady").onclick = async () => {
        await db.ref(`rooms/${state.roomCode}/players/${state.playerKey}/shopReady`).set(true);
        state.shopReady = true;
        checkAllShopReady();
      };
    }

    async function buyUpgrade(upgradeId) {
      const me = state.room.players[state.playerKey];
      const upgrade = UPGRADES.find(u => u.id === upgradeId);
      if (!upgrade || (me.coins||0) < upgrade.cost || me.upgrades?.includes(upgradeId)) return;
      await db.ref(`rooms/${state.roomCode}/players/${state.playerKey}`).update({
        coins: (me.coins||0) - upgrade.cost,
        upgrades: (me.upgrades||[]).concat([upgradeId])
      });
    }

    function checkAllShopReady() {
      const allReady = playersArray(state.room).every(p => p.shopReady);
      if (allReady && state.isCreator) {
        db.ref(`rooms/${state.roomCode}/gameState`).update({
          shopOpen: false, phase: "playing", round: (state.room.gameState.round||1)+1,
          deck: shuffle(Array.from({length:100},(_,i)=>i+1)).slice(0, deckSizeFor(playersArray(state.room).length)),
          discards: [[],[],[]], currentPlayerIndex: 0, turnPhase: "action", drawnCard: null,
          turnDeadline: nowServer() + TURN_MS
        });
      }
    }

    function renderFinalResults() {
      $("ended").classList.add("active");
      const results = state.room.gameState.roundResults || {};
      const totals = {};
      Object.values(results).flat().forEach(r => { totals[r.id] = (totals[r.id]||0) + r.cards; });
      const players = playersArray(state.room);
      const ranked = players.sort((a,b) => (totals[b.id]||0) - (totals[a.id]||0));
      $("winnerText").textContent = `${ranked[0]?.name} wins the Gauntlet!`;
      $("resultsList").innerHTML = ranked.map((p,i) => `<li>${i+1}. ${escapeHtml(p.name)} – ${totals[p.id]||0} total cards</li>`).join('');
    }

    function startTimer() {
      clearInterval(state.timerId);
      const tick = () => {
        const gs = state.room?.gameState;
        if (!gs || gs.phase !== "playing") { $("timer").textContent = "--"; return; }
        const left = Math.max(0, Math.ceil(((Number(gs.turnDeadline)||0) - nowServer())/1000));
        $("timer").textContent = `${left}s`;
        if (left <= 0) timeoutTurn();
      };
      tick(); state.timerId = setInterval(tick, 250);
    }

    async function startGame() {
      const room = state.room, players = playersArray(room);
      if (room.creator !== state.playerKey || players.length < 2) return;
      const deck = shuffle(Array.from({length:100},(_,i)=>i+1)).slice(0, deckSizeFor(players.length));
      const turnOrder = shuffle(players.map(p => p.id));
      // Reset per-round flags
      state.riskUsedThisRound = state.plus20Turns = state.rerollsUsed = 0;
      state.reverseUsed = state.chaosPileUsed = state.destroyUsed = state.stealHighUsed = state.poisonUsed = false;
      await db.ref(`rooms/${state.roomCode}`).update({
        turnOrder,
        "gameState/started": true, "gameState/phase": "playing", "gameState/round": 1,
        "gameState/deck": deck, "gameState/discards": [[],[],[]], "gameState/currentPlayerIndex": 0,
        "gameState/turnPhase": "action", "gameState/drawnCard": null, "gameState/winner": null,
        "gameState/turnDeadline": nowServer() + TURN_MS,
        "gameState/shopUpgrades": shuffle(UPGRADES).slice(0,6)
      });
    }

    async function drawCard() {
      await transactRoom(room => {
        const gs = room.gameState, me = room.players[state.playerKey];
        if (!isMyAction(room, "action") || !gs.deck?.length) return;
        const deck = gs.deck.slice(), drawn = deck.shift();
        // Check Risk It (1/7 once per round)
        if (me.upgrades?.includes("riskIt") && !state.riskUsedThisRound && Math.random() < 1/7) {
          state.riskUsedThisRound = true;
          const riskCards = deck.splice(0,2); // draw two more
          room.gameState = { ...gs, deck, drawnCard: null, riskCards, turnPhase: "risking" };
          return room;
        }
        // Overclock +20
        let effectiveCard = drawn;
        if (me.upgrades?.includes("plus20") && state.plus20Turns < 2) {
          effectiveCard = Math.min(100, drawn + 20);
          state.plus20Turns++;
        }
        room.gameState = { ...gs, deck, drawnCard: effectiveCard, turnPhase: "deciding" };
        return room;
      });
    }

    async function keepDrawn() {
      await transactRoom(room => {
        const gs = room.gameState;
        if (!isMyAction(room, "deciding") || gs.drawnCard == null) return;
        const me = room.players[state.playerKey];
        if (!canKeep(gs.drawnCard, me)) return;
        me.pile = [...(me.pile||[]), gs.drawnCard];
        room.gameState = { ...gs, ...advanceOrEnd(gs, room) };
        return room;
      });
    }

    async function discardDrawn(index) {
      await transactRoom(room => {
        const gs = room.gameState;
        if (!isMyAction(room, "deciding") || gs.drawnCard == null) return;
        const valid = validDiscardIndexes(gs.discards);
        if (!valid.includes(index)) return;
        const discards = normalizeDiscards(gs.discards);
        discards[index] = [...discards[index], gs.drawnCard];
        room.gameState = { ...gs, discards, ...advanceOrEnd(gs, room) };
        return room;
      });
      state.discardMode = false;
    }

    async function destroyDrawn() {
      await transactRoom(room => {
        if (!isMyAction(room, "deciding") || !room.players[state.playerKey]?.upgrades?.includes("destroy") || state.destroyUsed) return;
        state.destroyUsed = true;
        room.gameState = { ...room.gameState, ...advanceOrEnd(room.gameState, room) };
        return room;
      });
    }

    async function takeDiscard(index) {
      await transactRoom(room => {
        const gs = room.gameState;
        if (!isMyAction(room, "action")) return;
        const me = room.players[state.playerKey];
        const discards = normalizeDiscards(gs.discards);
        const card = discards[index]?.[discards[index].length-1];
        if (!canTake(card, me)) return;
        discards[index] = discards[index].slice(0,-1);
        me.pile = [...(me.pile||[]), card];
        room.gameState = { ...gs, discards, ...nextTurn(gs, (room.turnOrder||[]).length) };
        return room;
      });
    }

    async function timeoutTurn() {
      await transactRoom(room => {
        const gs = room.gameState;
        if (gs.deadline > nowServer()+500) return;
        if (gs.turnPhase === "deciding" && gs.drawnCard) {
          const idx = validDiscardIndexes(gs.discards)[0];
          const discards = normalizeDiscards(gs.discards);
          discards[idx] = [...discards[idx], gs.drawnCard];
          room.gameState = { ...gs, discards, ...advanceOrEnd(gs, room) };
        } else room.gameState = { ...gs, ...nextTurn(gs, (room.turnOrder||[]).length) };
        return room;
      });
    }

    async function transactRoom(mutator) {
      await db.ref(`rooms/${state.roomCode}`).transaction(room => {
        if (!room?.gameState || room.gameState.phase !== "playing") return room;
        return mutator(room) || room;
      });
    }

    function isMyAction(room, phase) {
      const gs = room.gameState, order = room.turnOrder || [];
      return order[Number(gs.currentPlayerIndex)||0] === state.playerKey && gs.turnPhase === phase;
    }

    function canTake(card, player) {
      if (card == null) return false;
      const top = topCard(player);
      return top === null || Number(card) > top;
    }

    function makeCard(value, cls) {
      const el = document.createElement("div"); el.className = cls||"card";
      if (value == null) { el.classList.add("empty-card"); el.textContent = "-"; }
      else { el.textContent = value; el.style.background = cardColor(value); }
      return el;
    }
    function makeMiniCard(v) { const el = document.createElement("div"); el.className="mini-card"; el.textContent=v; el.style.background=cardColor(v); return el; }

    function escapeHtml(s) { return String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'})[c]); }

    // Event listeners
    $("showCreate").onclick = () => { $("createForm").hidden=false; $("joinForm").hidden=true; };
    $("showJoin").onclick = () => { $("joinForm").hidden=false; $("createForm").hidden=true; };
    $("createForm").onsubmit = async e => { e.preventDefault(); try{await createRoom($("createName").value);}catch(err){setError("homeError",err.message);} };
    $("joinForm").onsubmit = async e => { e.preventDefault(); try{await joinRoom($("joinCode").value,$("joinName").value);}catch(err){setError("homeError",err.message);} };
    $("startGame").onclick = startGame;
    $("leaveLobby").onclick = () => { localStorage.clear(); location.reload(); };
    $("drawBtn").onclick = drawCard;
    $("keepBtn").onclick = keepDrawn;
    $("discardBtn").onclick = () => { state.discardMode=true; $("keepBtn").hidden=true; $("discardBtn").hidden=true; renderGame(); };
    $("destroyBtn").onclick = destroyDrawn;
    $("copyRoom").onclick = async () => { try{await navigator.clipboard.writeText(state.roomCode);}catch{}};
    $("backHome").onclick = () => { localStorage.clear(); location.reload(); };
    $("leaveGame").onclick = () => { localStorage.clear(); location.reload(); };

    auth.signInAnonymously().then(cred => {
      state.uid = cred.user.uid;
      db.ref(".info/serverTimeOffset").on("value", snap => { state.serverOffset = snap.val()||0; });
    }).then(() => {
      if (state.roomCode && state.playerKey) attachRoom();
    }).catch(err => setError("homeError", err.message));
  </script>
</body>
</html>
