<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Hardstuck</title>
  <script src="https://www.gstatic.com/firebasejs/10.12.5/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.5/firebase-auth-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.5/firebase-database-compat.js"></script>
  <style>
    :root {
      color-scheme: dark;
      --bg: #050507;
      --panel: #101015;
      --panel-2: #17171f;
      --line: #2b2b37;
      --text: #f5f5f7;
      --muted: #a6a6b3;
      --accent: #54d6a4;
      --danger: #ff6a7a;
      --warn: #ffd166;
      --shadow: 0 18px 50px rgba(0, 0, 0, .42);
    }

    * { box-sizing: border-box; }
    html, body { height: 100%; }
    body {
      margin: 0;
      min-height: 100%;
      background:
        radial-gradient(circle at 50% 35%, rgba(60, 76, 95, .18), transparent 34rem),
        linear-gradient(180deg, #0a0a0e 0%, var(--bg) 100%);
      color: var(--text);
      font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      letter-spacing: 0;
    }

    button, input {
      font: inherit;
      letter-spacing: 0;
    }

    button {
      border: 1px solid var(--line);
      border-radius: 8px;
      color: var(--text);
      background: #1d1d27;
      min-height: 42px;
      padding: 0 16px;
      cursor: pointer;
      transition: transform .14s ease, border-color .14s ease, background .14s ease, opacity .14s ease;
    }

    button:hover:enabled {
      transform: translateY(-1px);
      border-color: #505064;
      background: #252532;
    }

    button:disabled {
      cursor: not-allowed;
      opacity: .42;
    }

    .primary {
      background: linear-gradient(180deg, #43bd91, #25986f);
      border-color: #64e4b2;
      color: #03110c;
      font-weight: 800;
    }

    .danger {
      background: #321922;
      border-color: #734050;
      color: #ffdce2;
    }

    .ghost { background: transparent; }

    input {
      width: 100%;
      min-height: 44px;
      border: 1px solid var(--line);
      border-radius: 8px;
      padding: 0 12px;
      outline: none;
      background: #0c0c12;
      color: var(--text);
    }

    input:focus { border-color: var(--accent); }

    .screen {
      display: none;
      min-height: 100vh;
      padding: 24px;
    }

    .screen.active { display: block; }

    .shell {
      width: min(560px, 100%);
      margin: 8vh auto 0;
    }

    .title {
      font-size: clamp(46px, 8vw, 86px);
      line-height: .92;
      margin: 0 0 12px;
      font-weight: 950;
    }

    .subtitle {
      color: var(--muted);
      margin: 0 0 28px;
      font-size: 17px;
    }

    .panel {
      background: rgba(16, 16, 21, .94);
      border: 1px solid var(--line);
      border-radius: 8px;
      padding: 20px;
      box-shadow: var(--shadow);
    }

    .stack { display: grid; gap: 14px; }
    .row { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; }
    .row > * { flex: 1 1 auto; }
    .muted { color: var(--muted); }
    .error { color: #ff97a4; min-height: 22px; }
    .room-code {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      min-width: 150px;
      min-height: 64px;
      border: 1px solid #56566b;
      border-radius: 8px;
      font-size: 42px;
      font-weight: 950;
      letter-spacing: .08em;
      background: #0b0b10;
    }

    .players-list {
      display: grid;
      gap: 8px;
      margin: 0;
      padding: 0;
      list-style: none;
    }

    .players-list li {
      display: flex;
      justify-content: space-between;
      gap: 12px;
      padding: 10px 12px;
      border: 1px solid var(--line);
      border-radius: 8px;
      background: #111118;
    }

    .game {
      min-height: 100vh;
      padding: 16px;
      overflow: hidden;
    }

    .topbar {
      position: relative;
      z-index: 4;
      display: grid;
      grid-template-columns: auto 1fr auto; /* changed: left buttons, center status, right timer */
      align-items: center;
      gap: 14px;
      min-height: 58px;
    }

    .topbar .left-buttons {
      display: flex;
      gap: 10px;
    }

    .status {
      justify-self: center;
      text-align: center;
      display: grid;
      gap: 3px;
    }

    .turn {
      font-size: 22px;
      font-weight: 850;
    }

    .timer {
      justify-self: end;
      min-width: 74px;
      text-align: center;
      border: 1px solid var(--line);
      border-radius: 8px;
      padding: 9px 12px;
      background: #111118;
      font-weight: 900;
      font-variant-numeric: tabular-nums;
    }

    .table {
      position: relative;
      height: calc(100vh - 90px);
      min-height: 620px;
    }

    .center {
      position: absolute;
      left: 50%;
      top: 46%;
      transform: translate(-50%, -50%);
      width: min(520px, 86vw);
      display: grid;
      gap: 16px;
      justify-items: center;
      z-index: 2;
    }

    /* New layout for draw pile + discards */
    .draw-discard-group {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 18px;
      width: 100%;
    }

    .deck-zone {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 8px;
    }

    .discard-row {
      display: flex;
      justify-content: center;
      gap: 24px;
      flex-wrap: wrap;
      align-items: flex-start;
    }

    .discard-zone {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 8px;
    }

    .card {
      width: 72px;
      height: 100px;
      border-radius: 8px;
      display: grid;
      place-items: center;
      color: white;
      font-weight: 950;
      font-size: 28px;
      border: 1px solid rgba(255,255,255,.28);
      box-shadow: 0 12px 26px rgba(0,0,0,.36);
      text-shadow: 0 1px 2px rgba(0,0,0,.65);
      user-select: none;
    }

    .card.back {
      background:
        linear-gradient(135deg, rgba(255,255,255,.08) 25%, transparent 25%) 0 0 / 16px 16px,
        linear-gradient(315deg, rgba(255,255,255,.06) 25%, transparent 25%) 0 0 / 16px 16px,
        #20202b;
      color: #d7d7e6;
    }

    .empty-card {
      border: 1px dashed #454557;
      background: rgba(255,255,255,.03);
      color: #707082;
      box-shadow: none;
    }

    .pile-label {
      color: var(--muted);
      font-size: 13px;
      min-height: 18px;
    }

    .drawn-zone {
      position: absolute;
      left: 50%;
      bottom: 7%;
      transform: translateX(-50%);
      z-index: 4;
      min-width: min(440px, 92vw);
      padding: 14px;
      border: 1px solid var(--line);
      border-radius: 8px;
      background: rgba(17, 17, 24, .92);
      box-shadow: var(--shadow);
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 8px;
    }

    .drawn-actions {
      display: flex;
      gap: 10px;
      flex-wrap: wrap;
      justify-content: center;
    }

    .player {
      position: absolute;
      width: 230px;
      max-width: 32vw;
      transform: translate(-50%, -50%);
      padding: 10px;
      border: 1px solid var(--line);
      border-radius: 8px;
      background: rgba(13, 13, 18, .9);
      box-shadow: 0 10px 28px rgba(0,0,0,.3);
      z-index: 1;
    }

    .player.me { border-color: #5fd3aa; }
    .player.active-player { box-shadow: 0 0 0 2px rgba(84, 214, 164, .7), 0 14px 32px rgba(0,0,0,.38); }

    .player-head {
      display: flex;
      justify-content: space-between;
      gap: 8px;
      align-items: baseline;
      margin-bottom: 8px;
      min-width: 0;
    }

    .player-name {
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
      font-weight: 850;
    }

    .count {
      color: var(--muted);
      font-size: 13px;
      flex: 0 0 auto;
    }

    .mini-cards {
      min-height: 34px;
      display: flex;
      flex-wrap: wrap;
      gap: 5px;
      align-items: center;
    }

    .mini-card {
      width: 30px;
      height: 38px;
      border-radius: 5px;
      display: grid;
      place-items: center;
      color: white;
      font-size: 12px;
      font-weight: 900;
      border: 1px solid rgba(255,255,255,.24);
      text-shadow: 0 1px 1px rgba(0,0,0,.6);
    }

    .fly-card {
      position: fixed;
      z-index: 30;
      pointer-events: none;
      transition: transform .42s cubic-bezier(.2, .86, .28, 1), opacity .42s ease;
      will-change: transform, opacity;
    }

    .ended {
      position: fixed;
      inset: 0;
      display: none;
      place-items: center;
      z-index: 10;
      background: rgba(0, 0, 0, .72);
      padding: 20px;
    }

    .ended.active { display: grid; }
    .results { width: min(540px, 100%); }

    @media (max-width: 760px) {
      .screen { padding: 16px; }
      .game { padding: 10px; overflow: auto; }
      .topbar {
        grid-template-columns: auto 1fr auto; /* keep left buttons, center status, timer */
        align-items: start;
      }
      .status {
        grid-column: 1 / -1;
        order: 2;
      }
      .timer { justify-self: end; }
      .table {
        height: auto;
        min-height: 980px;
      }
      .center {
        top: 420px;
        width: min(100%, 430px);
      }
      .drawn-zone {
        bottom: 210px;
      }
      .player {
        width: 44vw;
        max-width: 190px;
      }
      .card { width: 62px; height: 86px; font-size: 24px; }
      button { padding: 0 12px; }
    }
  </style>
</head>
<body>
  <main id="home" class="screen active">
    <section class="shell">
      <h1 class="title">Hardstuck</h1>
      <p class="subtitle">Climb only upward. Every low card becomes someone else's temptation.</p>
      <div class="panel stack">
        <div class="row">
          <button id="showCreate" class="primary">Create Room</button>
          <button id="showJoin">Join Room</button>
        </div>
        <form id="createForm" class="stack" hidden>
          <input id="createName" maxlength="24" autocomplete="name" placeholder="Username" required>
          <button class="primary" type="submit">Create</button>
        </form>
        <form id="joinForm" class="stack" hidden>
          <input id="joinName" maxlength="24" autocomplete="name" placeholder="Username" required>
          <input id="joinCode" maxlength="4" autocapitalize="characters" placeholder="Room code" required>
          <button class="primary" type="submit">Join</button>
        </form>
        <div id="homeError" class="error"></div>
      </div>
    </section>
  </main>

  <main id="lobby" class="screen">
    <section class="shell">
      <h1 class="title">Room</h1>
      <div class="panel stack">
        <div>
          <div class="muted">Share this code</div>
          <div id="roomCode" class="room-code"></div>
        </div>
        <ul id="lobbyPlayers" class="players-list"></ul>
        <div class="row">
          <button id="startGame" class="primary" disabled>Start Game</button>
          <button id="leaveLobby" class="ghost">Leave</button>
        </div>
        <div id="lobbyError" class="error"></div>
      </div>
    </section>
  </main>

  <main id="game" class="screen game">
    <header class="topbar">
      <div class="left-buttons">
        <button id="copyRoom" class="ghost">Room <span id="gameRoomCode"></span></button>
        <button id="leaveGame" class="ghost">Leave</button>
      </div>
      <div class="status">
        <div id="turnText" class="turn">Waiting</div>
        <div id="phaseText" class="muted"></div>
      </div>
      <div id="timer" class="timer">30s</div>
    </header>
    <section id="table" class="table">
      <div id="playersRing"></div>
      <div class="center">
        <div class="draw-discard-group">
          <div class="deck-zone">
            <div id="deckCard" class="card back">?</div>
            <button id="drawBtn" class="primary">Draw</button>
            <div id="deckCount" class="pile-label"></div>
          </div>
          <div id="discards" class="discard-row"></div>
        </div>
        <div id="drawnZone" class="drawn-zone" hidden>
          <div class="pile-label">Drawn card</div>
          <div id="drawnCard" class="card"></div>
          <div id="drawnHint" class="muted"></div>
          <div class="drawn-actions">
            <button id="keepBtn" class="primary">Keep</button>
            <button id="discardBtn" class="danger">Discard</button>
          </div>
        </div>
      </div>
    </section>
    <div id="ended" class="ended">
      <div class="panel results stack">
        <h2 style="margin:0;font-size:32px;">Game Over</h2>
        <div id="winnerText"></div>
        <ul id="resultsList" class="players-list"></ul>
        <button id="backHome" class="primary">Back to Start</button>
      </div>
    </div>
  </main>

  <script>
    const firebaseConfig = {
      apiKey: "AIzaSyANEQA7aOltYtY-MHYwEpz17zzhBLppDBc",
      authDomain: "hardstuck-game.firebaseapp.com",
      databaseURL: "https://hardstuck-game-default-rtdb.asia-southeast1.firebasedatabase.app",
      projectId: "hardstuck-game",
      storageBucket: "hardstuck-game.firebasestorage.app",
      messagingSenderId: "1006298740610",
      appId: "1:1006298740610:web:5af1dec86271607eb3019b"
    };

    firebase.initializeApp(firebaseConfig);
    const auth = firebase.auth();
    const db = firebase.database();

    const TURN_MS = 30000;
    const screens = {
      home: document.getElementById("home"),
      lobby: document.getElementById("lobby"),
      game: document.getElementById("game")
    };
    const state = {
      uid: null,
      playerKey: localStorage.getItem("hardstuckPlayerKey") || null,
      roomCode: localStorage.getItem("hardstuckRoomCode") || null,
      isCreator: localStorage.getItem("hardstuckCreator") === "1",
      room: null,
      serverOffset: 0,
      discardMode: false,
      timerId: null,
      roomRef: null,
      previousRoom: null,
      seenDrawnKey: null,
      seenPileSizes: {},
      lastDrawnRect: null
    };

    const $ = (id) => document.getElementById(id);

    function showScreen(name) {
      Object.entries(screens).forEach(([key, el]) => el.classList.toggle("active", key === name));
    }

    function setError(id, message) {
      $(id).textContent = message || "";
    }

    function cleanName(name) {
      return String(name || "").trim().slice(0, 24) || "Player";
    }

    function cleanCode(code) {
      return String(code || "").trim().toUpperCase().replace(/[^A-Z]/g, "").slice(0, 4);
    }

    function cardColor(value) {
      const hue = 240 - ((Number(value) - 1) * 90 / 99);
      return `hsl(${hue}, 70%, 60%)`;
    }

    function randomCode() {
      const letters = "ABCDEFGHJKLMNPQRSTUVWXYZ";
      return Array.from({ length: 4 }, () => letters[Math.floor(Math.random() * letters.length)]).join("");
    }

    function shuffle(items) {
      const copy = items.slice();
      for (let i = copy.length - 1; i > 0; i--) {
        const j = Math.floor(Math.random() * (i + 1));
        [copy[i], copy[j]] = [copy[j], copy[i]];
      }
      return copy;
    }

    function deckSizeFor(count) {
      if (count <= 2) return 16;
      if (count === 3) return 28;
      if (count === 4) return 40;
      return 50;
    }

    function topCard(player) {
      const pile = Array.isArray(player && player.pile) ? player.pile : [];
      return pile.length ? Math.max(...pile) : null;
    }

    function canKeep(card, player) {
      const top = topCard(player);
      return top === null || Number(card) > top;
    }

    function validDiscardIndexes(discards) {
      const piles = normalizeDiscards(discards);
      const hasEmpty = piles.some((pile) => pile.length === 0);
      return piles.map((pile, index) => (!hasEmpty || pile.length === 0 ? index : -1)).filter((index) => index >= 0);
    }

    function canTake(card, player) {
      if (card == null) return false;
      const top = topCard(player);
      return top === null || Number(card) > top;
    }

    function normalizeDiscards(discards) {
      return [0, 1, 2].map((index) => Array.isArray(discards && discards[index]) ? discards[index] : []);
    }

    function playersArray(room) {
      const players = room && room.players ? room.players : {};
      const order = Array.isArray(room && room.turnOrder) ? room.turnOrder : Object.keys(players);
      return order.filter((id) => players[id]).map((id) => ({ id, ...players[id] }));
    }

    function currentPlayerId(gameState) {
      const order = Array.isArray(state.room && state.room.turnOrder) ? state.room.turnOrder : [];
      return order[Number(gameState && gameState.currentPlayerIndex) || 0] || null;
    }

    function nowServer() {
      return Date.now() + state.serverOffset;
    }

    function nextTurn(gameState, orderLength) {
      const nextIndex = (Number(gameState.currentPlayerIndex || 0) + 1) % orderLength;
      return {
        currentPlayerIndex: nextIndex,
        turnPhase: "action",
        drawnCard: null,
        turnDeadline: nowServer() + TURN_MS
      };
    }

    function endGamePatch(gameState, room) {
      const players = room.players || {};
      const ordered = playersArray(room);
      const ranked = ordered.slice().sort((a, b) => {
        const countDiff = (Array.isArray(b.pile) ? b.pile.length : 0) - (Array.isArray(a.pile) ? a.pile.length : 0);
        if (countDiff) return countDiff;
        const aTop = topCard(a);
        const bTop = topCard(b);
        return (aTop == null ? Infinity : aTop) - (bTop == null ? Infinity : bTop);
      });
      return {
        phase: "ended",
        winner: ranked[0] ? ranked[0].id : null,
        turnPhase: "action",
        drawnCard: null,
        turnDeadline: gameState.turnDeadline || firebase.database.ServerValue.TIMESTAMP
      };
    }

    function advanceOrEndPatch(gameState, room) {
      if (!Array.isArray(gameState.deck) || gameState.deck.length === 0) {
        return endGamePatch(gameState, room);
      }
      return nextTurn(gameState, (room.turnOrder || []).length);
    }

    function makeCard(value, className) {
      const el = document.createElement("div");
      el.className = className || "card";
      if (value == null) {
        el.classList.add("empty-card");
        el.textContent = "-";
      } else {
        el.textContent = value;
        el.style.background = cardColor(value);
      }
      return el;
    }

    async function createRoom(name) {
      setError("homeError", "");
      let code = randomCode();
      for (let attempt = 0; attempt < 12; attempt++) {
        const snap = await db.ref(`rooms/${code}`).get();
        if (!snap.exists()) break;
        code = randomCode();
      }
      const roomRef = db.ref(`rooms/${code}`);
      const playerRef = roomRef.child("players").push();
      await roomRef.set({
        players: {
          [playerRef.key]: { name: cleanName(name), pile: [] }
        },
        creator: playerRef.key,
        gameState: {
          started: false,
          deck: [],
          discards: [[], [], []],
          currentPlayerIndex: 0,
          turnPhase: "action",
          drawnCard: null,
          turnDeadline: firebase.database.ServerValue.TIMESTAMP,
          phase: "lobby",
          winner: null
        },
        turnOrder: []
      });
      enterRoom(code, playerRef.key, true);
    }

    async function joinRoom(code, name) {
      setError("homeError", "");
      code = cleanCode(code);
      if (code.length !== 4) throw new Error("Enter a 4-letter room code.");
      const roomRef = db.ref(`rooms/${code}`);
      const snap = await roomRef.get();
      if (!snap.exists()) throw new Error("Room not found.");
      const room = snap.val();
      if (room.gameState && room.gameState.started) throw new Error("That game has already started.");
      const playerRef = roomRef.child("players").push();
      await playerRef.set({ name: cleanName(name), pile: [] });
      enterRoom(code, playerRef.key, false);
    }

    function enterRoom(code, playerKey, creator) {
      state.roomCode = code;
      state.playerKey = playerKey;
      state.isCreator = !!creator;
      localStorage.setItem("hardstuckRoomCode", code);
      localStorage.setItem("hardstuckPlayerKey", playerKey);
      localStorage.setItem("hardstuckCreator", creator ? "1" : "0");
      attachRoom();
    }

    function attachRoom() {
      if (!state.roomCode) return;
      if (state.roomRef) state.roomRef.off();
      state.roomRef = db.ref(`rooms/${state.roomCode}`);
      state.roomRef.on("value", (snap) => {
        const previousRoom = state.room;
        state.room = snap.val();
        if (!state.room) {
          localStorage.removeItem("hardstuckRoomCode");
          localStorage.removeItem("hardstuckPlayerKey");
          localStorage.removeItem("hardstuckCreator");
          showScreen("home");
          return;
        }
        if (state.room.gameState && state.room.gameState.started) {
          showScreen("game");
          renderGame();
          detectAnimations(previousRoom, state.room);
        } else {
          showScreen("lobby");
          renderLobby();
        }
        state.previousRoom = state.room;
      });
    }

    function renderLobby() {
      $("roomCode").textContent = state.roomCode;
      const players = playersArray(state.room);
      $("lobbyPlayers").innerHTML = "";
      players.forEach((player, index) => {
        const li = document.createElement("li");
        li.innerHTML = `<span>${index + 1}. ${escapeHtml(player.name)}</span><span>${player.id === state.playerKey ? "you" : ""}</span>`;
        $("lobbyPlayers").appendChild(li);
      });
      const isCreator = state.room && state.room.creator === state.playerKey;
      $("startGame").hidden = !isCreator;
      $("startGame").disabled = !isCreator || players.length < 2;
    }

    function renderGame() {
      const room = state.room || {};
      const gs = room.gameState || {};
      const players = playersArray(room);
      const me = room.players && room.players[state.playerKey];
      const currentId = currentPlayerId(gs);
      const myTurn = currentId === state.playerKey && gs.phase === "playing";
      const current = currentId && room.players ? room.players[currentId] : null;
      const phaseText = gs.phase === "ended" ? "Ended" : gs.turnPhase === "deciding" ? "Choose keep or discard" : "Choose draw or take";
      $("gameRoomCode").textContent = state.roomCode;
      $("turnText").textContent = gs.phase === "ended" ? "Game over" : `${current ? current.name : "Player"}'s turn`;
      $("phaseText").textContent = `${phaseText}${myTurn ? " - your move" : ""}`;
      $("deckCount").textContent = `${Array.isArray(gs.deck) ? gs.deck.length : 0} in deck`;
      $("drawBtn").hidden = !(myTurn && gs.turnPhase === "action");
      $("drawBtn").disabled = !(myTurn && gs.turnPhase === "action" && Array.isArray(gs.deck) && gs.deck.length > 0);
      renderDiscards(gs, me, myTurn);
      renderDrawn(gs, me, myTurn);
      renderPlayers(players, currentId);
      renderResults(players, gs);
      startTimer();
    }

    function renderDiscards(gs, me, myTurn) {
      const wrap = $("discards");
      wrap.innerHTML = "";
      normalizeDiscards(gs.discards).forEach((pile, index) => {
        const top = pile.length ? pile[pile.length - 1] : null;
        const zone = document.createElement("div");
        zone.className = "discard-zone";
        zone.dataset.discardIndex = index;
        zone.appendChild(makeCard(top, "card"));
        const btn = document.createElement("button");
        if (state.discardMode) {
          btn.textContent = "Discard here";
          btn.hidden = !(myTurn && gs.turnPhase === "deciding");
          btn.disabled = !(myTurn && gs.turnPhase === "deciding" && validDiscardIndexes(gs.discards).includes(index));
          btn.onclick = () => discardDrawn(index);
        } else {
          btn.textContent = "Take";
          btn.hidden = !(myTurn && gs.turnPhase === "action" && canTake(top, me));
          btn.disabled = !(myTurn && gs.turnPhase === "action" && canTake(top, me));
          btn.onclick = () => takeDiscard(index);
        }
        zone.appendChild(btn);
        const label = document.createElement("div");
        label.className = "pile-label";
        label.textContent = `Discard ${index + 1}`;
        zone.appendChild(label);
        wrap.appendChild(zone);
      });
    }

    function renderDrawn(gs, me, myTurn) {
      const hasDrawn = gs.turnPhase === "deciding" && gs.drawnCard != null;
      $("drawnZone").hidden = !hasDrawn;
      if (!hasDrawn) {
        state.discardMode = false;
        return;
      }
      $("drawnCard").replaceWith(makeCard(gs.drawnCard, "card"));
      document.querySelector("#drawnZone .card").id = "drawnCard";
      state.lastDrawnRect = $("drawnCard").getBoundingClientRect();
      const allowed = canKeep(gs.drawnCard, me);
      $("drawnHint").textContent = allowed ? "You may keep it or discard it." : "Lower than your top card. You must discard it.";
      $("keepBtn").hidden = !(myTurn && !state.discardMode);
      $("discardBtn").hidden = !(myTurn && !state.discardMode);
      $("keepBtn").disabled = !(myTurn && allowed && !state.discardMode);
      $("discardBtn").disabled = !(myTurn && !state.discardMode);
    }

    function renderPlayers(players, currentId) {
      const ring = $("playersRing");
      ring.innerHTML = "";
      const mobile = window.matchMedia("(max-width: 760px)").matches;
      const radiusX = mobile ? 37 : 43;
      const radiusY = mobile ? 40 : 39;
      const meIndex = Math.max(0, players.findIndex((player) => player.id === state.playerKey));
      const visualPlayers = players.slice(meIndex).concat(players.slice(0, meIndex));
      visualPlayers.forEach((player, index) => {
        const angle = 90 + (360 * index / Math.max(visualPlayers.length, 1));
        const x = 50 + radiusX * Math.cos(angle * Math.PI / 180);
        const y = 50 + radiusY * Math.sin(angle * Math.PI / 180);
        const el = document.createElement("article");
        el.className = `player${player.id === state.playerKey ? " me" : ""}${player.id === currentId ? " active-player" : ""}`;
        el.dataset.playerId = player.id;
        el.style.left = `${x}%`;
        el.style.top = `${y}%`;
        const pile = Array.isArray(player.pile) ? player.pile.slice().sort((a, b) => a - b) : [];
        el.innerHTML = `
          <div class="player-head">
            <div class="player-name">${escapeHtml(player.name)}</div>
            <div class="count">${pile.length} cards${topCard(player) == null ? "" : ` - top ${topCard(player)}`}</div>
          </div>
          <div class="mini-cards"></div>
        `;
        const minis = el.querySelector(".mini-cards");
        pile.forEach((card) => minis.appendChild(makeMiniCard(card)));
        ring.appendChild(el);
      });
    }

    function makeMiniCard(value) {
      const el = document.createElement("div");
      el.className = "mini-card";
      el.textContent = value;
      el.style.background = cardColor(value);
      return el;
    }

    function detectAnimations(previousRoom, room) {
      if (!previousRoom || !room || !room.gameState || room.gameState.phase !== "playing") return;
      const prevGs = previousRoom.gameState || {};
      const gs = room.gameState || {};
      const currentId = currentPlayerId(gs);
      const drawnKey = `${currentId || ""}:${gs.drawnCard || ""}:${Array.isArray(gs.deck) ? gs.deck.length : 0}`;
      if (gs.turnPhase === "deciding" && gs.drawnCard != null && state.seenDrawnKey !== drawnKey) {
        state.seenDrawnKey = drawnKey;
        setTimeout(() => flyCard(gs.drawnCard, $("deckCard"), $("drawnCard")), 40);
      }
      if (gs.turnPhase !== "deciding") state.seenDrawnKey = null;

      const prevPlayers = previousRoom.players || {};
      const currPlayers = room.players || {};
      Object.keys(currPlayers).forEach((playerId) => {
        const prevPile = Array.isArray(prevPlayers[playerId] && prevPlayers[playerId].pile) ? prevPlayers[playerId].pile : [];
        const currPile = Array.isArray(currPlayers[playerId].pile) ? currPlayers[playerId].pile : [];
        if (currPile.length <= prevPile.length) return;
        const added = currPile[currPile.length - 1];
        const source = sourceForAddedCard(added, prevGs, gs);
        const target = document.querySelector(`.player[data-player-id="${cssEscape(playerId)}"] .mini-cards`);
        if (source && target) setTimeout(() => flyCard(added, source, target), 40);
      });
    }

    function sourceForAddedCard(card, prevGs, gs) {
      if (prevGs && prevGs.drawnCard === card) return state.lastDrawnRect || $("drawnCard");
      const prevDiscards = normalizeDiscards(prevGs && prevGs.discards);
      const currDiscards = normalizeDiscards(gs && gs.discards);
      for (let i = 0; i < 3; i++) {
        const prevTop = prevDiscards[i][prevDiscards[i].length - 1];
        if (prevTop === card && currDiscards[i].length === prevDiscards[i].length - 1) {
          const zone = document.querySelector(`.discard-zone[data-discard-index="${i}"]`);
          return zone && zone.querySelector(".card");
        }
      }
      return $("deckCard");
    }

    function flyCard(value, sourceEl, targetEl) {
      if (!sourceEl || !targetEl) return;
      const sourceRect = typeof sourceEl.getBoundingClientRect === "function" ? sourceEl.getBoundingClientRect() : sourceEl;
      const targetRect = targetEl.getBoundingClientRect();
      if (!sourceRect.width || !sourceRect.height || !targetRect.width || !targetRect.height) return;
      const card = makeCard(value, "card fly-card");
      card.style.left = `${sourceRect.left}px`;
      card.style.top = `${sourceRect.top}px`;
      card.style.width = `${sourceRect.width}px`;
      card.style.height = `${sourceRect.height}px`;
      document.body.appendChild(card);
      const dx = targetRect.left + targetRect.width / 2 - (sourceRect.left + sourceRect.width / 2);
      const dy = targetRect.top + targetRect.height / 2 - (sourceRect.top + sourceRect.height / 2);
      requestAnimationFrame(() => {
        card.style.transform = `translate(${dx}px, ${dy}px) scale(.45)`;
        card.style.opacity = "0";
      });
      setTimeout(() => card.remove(), 480);
    }

    function cssEscape(value) {
      if (window.CSS && CSS.escape) return CSS.escape(value);
      return String(value).replace(/["\\]/g, "\\$&");
    }

    function renderResults(players, gs) {
      const active = gs.phase === "ended";
      $("ended").classList.toggle("active", active);
      if (!active) return;
      const ranked = players.slice().sort((a, b) => {
        const countDiff = (Array.isArray(b.pile) ? b.pile.length : 0) - (Array.isArray(a.pile) ? a.pile.length : 0);
        if (countDiff) return countDiff;
        return (topCard(a) == null ? Infinity : topCard(a)) - (topCard(b) == null ? Infinity : topCard(b));
      });
      const winner = ranked[0];
      $("winnerText").textContent = winner ? `${winner.name} wins with ${winner.pile.length} cards.` : "No winner.";
      $("resultsList").innerHTML = "";
      ranked.forEach((player, index) => {
        const li = document.createElement("li");
        const pile = Array.isArray(player.pile) ? player.pile : [];
        li.innerHTML = `<span>${index + 1}. ${escapeHtml(player.name)}</span><span>${pile.length} cards, top ${topCard(player) || "-"}</span>`;
        $("resultsList").appendChild(li);
      });
    }

    function startTimer() {
      clearInterval(state.timerId);
      const tick = () => {
        const gs = state.room && state.room.gameState;
        if (!gs || gs.phase !== "playing") {
          $("timer").textContent = "--";
          return;
        }
        const deadline = Number(gs.turnDeadline);
        if (!Number.isFinite(deadline) || deadline <= 0) {
          $("timer").textContent = "30s";
          return;
        }
        const left = Math.max(0, Math.ceil((deadline - nowServer()) / 1000));
        $("timer").textContent = `${left}s`;
        if (left <= 0) timeoutTurn();
      };
      tick();
      state.timerId = setInterval(tick, 250);
    }

    async function startGame() {
      const room = state.room;
      const players = playersArray(room);
      if (!room || room.creator !== state.playerKey || players.length < 2) return;
      const count = deckSizeFor(players.length);
      const deck = shuffle(Array.from({ length: 100 }, (_, i) => i + 1)).slice(0, count);
      await db.ref(`rooms/${state.roomCode}`).update({
        turnOrder: players.map((p) => p.id),
        "gameState/started": true,
        "gameState/phase": "playing",
        "gameState/deck": deck,
        "gameState/discards": [[], [], []],
        "gameState/currentPlayerIndex": 0,
        "gameState/turnPhase": "action",
        "gameState/drawnCard": null,
        "gameState/winner": null,
        "gameState/turnDeadline": nowServer() + TURN_MS
      });
    }

    async function transactRoom(mutator) {
      await db.ref(`rooms/${state.roomCode}`).transaction((room) => {
        if (!room || !room.gameState || room.gameState.phase !== "playing") return room;
        return mutator(room) || room;
      });
    }

    function isMyAction(room, phase) {
      const gs = room.gameState;
      const order = Array.isArray(room.turnOrder) ? room.turnOrder : [];
      return order[Number(gs.currentPlayerIndex) || 0] === state.playerKey && gs.turnPhase === phase;
    }

    async function drawCard() {
      await transactRoom((room) => {
        const gs = room.gameState;
        if (!isMyAction(room, "action") || !Array.isArray(gs.deck) || gs.deck.length === 0) return room;
        const deck = gs.deck.slice();
        const drawn = deck.shift();
        room.gameState = { ...gs, deck, drawnCard: drawn, turnPhase: "deciding" };
        return room;
      });
    }

    async function keepDrawn() {
      $("drawnZone").hidden = true;
      await transactRoom((room) => {
        const gs = room.gameState;
        if (!isMyAction(room, "deciding") || gs.drawnCard == null) return room;
        const player = room.players[state.playerKey];
        if (!canKeep(gs.drawnCard, player)) return room;
        player.pile = Array.isArray(player.pile) ? player.pile.concat([gs.drawnCard]) : [gs.drawnCard];
        room.gameState = { ...gs, ...advanceOrEndPatch(gs, room) };
        return room;
      });
    }

    async function discardDrawn(index) {
      $("drawnZone").hidden = true;
      await transactRoom((room) => {
        const gs = room.gameState;
        if (!isMyAction(room, "deciding") || gs.drawnCard == null) return room;
        const valid = validDiscardIndexes(gs.discards);
        if (!valid.includes(index)) return room;
        const discards = normalizeDiscards(gs.discards);
        discards[index] = discards[index].concat([gs.drawnCard]);
        room.gameState = { ...gs, discards, ...advanceOrEndPatch(gs, room) };
        return room;
      });
      state.discardMode = false;
    }

    async function takeDiscard(index) {
      await transactRoom((room) => {
        const gs = room.gameState;
        if (!isMyAction(room, "action")) return room;
        const player = room.players[state.playerKey];
        const discards = normalizeDiscards(gs.discards);
        const card = discards[index] && discards[index][discards[index].length - 1];
        if (!canTake(card, player)) return room;
        discards[index] = discards[index].slice(0, -1);
        player.pile = Array.isArray(player.pile) ? player.pile.concat([card]) : [card];
        room.gameState = { ...gs, discards, ...nextTurn(gs, (room.turnOrder || []).length) };
        return room;
      });
    }

    async function timeoutTurn() {
      await transactRoom((room) => {
        const gs = room.gameState;
        const deadline = Number(gs.turnDeadline);
        if (!Number.isFinite(deadline) || deadline <= 0) return room;
        if (deadline > nowServer() + 500) return room;
        if (gs.turnPhase === "deciding" && gs.drawnCard != null) {
          const index = validDiscardIndexes(gs.discards)[0];
          const discards = normalizeDiscards(gs.discards);
          discards[index] = discards[index].concat([gs.drawnCard]);
          room.gameState = { ...gs, discards, ...advanceOrEndPatch(gs, room) };
        } else {
          room.gameState = { ...gs, ...nextTurn(gs, (room.turnOrder || []).length) };
        }
        return room;
      });
    }

    function escapeHtml(value) {
      return String(value).replace(/[&<>"']/g, (char) => ({
        "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;"
      }[char]));
    }

    $("showCreate").onclick = () => {
      $("createForm").hidden = false;
      $("joinForm").hidden = true;
    };
    $("showJoin").onclick = () => {
      $("joinForm").hidden = false;
      $("createForm").hidden = true;
    };
    $("createForm").onsubmit = async (event) => {
      event.preventDefault();
      try { await createRoom($("createName").value); } catch (err) { setError("homeError", err.message); }
    };
    $("joinForm").onsubmit = async (event) => {
      event.preventDefault();
      try { await joinRoom($("joinCode").value, $("joinName").value); } catch (err) { setError("homeError", err.message); }
    };
    $("startGame").onclick = startGame;
    $("leaveLobby").onclick = () => {
      localStorage.clear();
      location.reload();
    };
    $("drawBtn").onclick = drawCard;
    $("keepBtn").onclick = keepDrawn;
    $("discardBtn").onclick = () => {
      state.discardMode = true;
      $("keepBtn").hidden = true;
      $("discardBtn").hidden = true;
      renderGame();
    };
    $("copyRoom").onclick = async () => {
      try { await navigator.clipboard.writeText(state.roomCode); } catch (_) {}
    };
    $("backHome").onclick = () => {
      localStorage.clear();
      location.reload();
    };

    // New Leave button during the game
    $("leaveGame").onclick = () => {
      localStorage.clear();
      location.reload();
    };

    auth.signInAnonymously().then((cred) => {
      state.uid = cred.user.uid;
      return db.ref(".info/serverTimeOffset").on("value", (snap) => {
        state.serverOffset = snap.val() || 0;
      });
    }).then(() => {
      if (state.roomCode && state.playerKey) attachRoom();
    }).catch((err) => setError("homeError", err.message));
  </script>
</body>
</html>
